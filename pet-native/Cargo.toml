[package]
name = "pet-native"
version = "0.2.0"
edition = "2021"
description = "铃·桌宠 原生实现（Win32 分层窗口，不经过 WebView2）"

[dependencies]
winapi = { version = "0.3", features = [
  "winuser", "wingdi", "libloaderapi", "winbase", "errhandlingapi", "minwindef", "windef"
] }
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "pet-native"
path = "src/main.rs"
